services:
  # 1. FastAPI AI Service
  - type: web
    name: bugsense-python-ai
    runtime: python
    rootDir: python-ai
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: KNOWLEDGEBASE_PATH
        value: /app/knowledgebase
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. Node.js Express Gateway API
  - type: web
    name: bugsense-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PYTHON_AI_URL
        fromService:
          name: bugsense-python-ai
          type: web
          property: host
      - key: MONGODB_URI
        sync: false

  # 3. React Frontend
  - type: web
    name: bugsense-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: bugsense-server
          type: web
          property: host
