version: '3.8'

services:
  # Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: bugsense-db
    restart: always
    environment:
      POSTGRES_DB: bugsense
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: strong-postgres-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bugsense"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vector Database for RAG
  chromadb:
    image: chromadb/chroma:0.4.15
    container_name: bugsense-chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/data

  # FastAPI Backend Server
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: bugsense-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:strong-postgres-password@postgres:5432/bugsense
      - VECTOR_DB_TYPE=chroma
      - CHROMA_DB_PATH=/app/vectordb/chroma_data
      - EMBEDDING_PROVIDER=local  # local, gemini, openai
      - LLM_PROVIDER=gemini        # gemini, openai, mock
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=super-secret-key-change-in-production-1234567890!
    ports:
      - "8080:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

  # React Frontend (Proxied by Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: bugsense-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
